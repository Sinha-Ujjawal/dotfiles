# ============================================================
# GruberDarker
# ============================================================

# Background
set -g status-style "bg=#181818,fg=#65737e"

# Status
set -g status-left-length 60
set -g status-right-length 100

# Session — purple
set -g status-left \
    "#[bg=#9e95c7,fg=#181818,bold] #S #[default]"

# Inactive windows
setw -g window-status-format \
    "#[bg=#181818,fg=#65737e] #W "

# Active window — Gruber yellow
setw -g window-status-current-format \
    "#[bg=#ffdd33,fg=#181818,bold] #W "

# Date — green, time — red
set -g status-right \
    "#[fg=#73c936] %Y-%m-%d #[fg=#f43841,bold]%H:%M "

# Pane borders
set -g pane-border-style "fg=#453d41"
set -g pane-active-border-style "fg=#9e95c7"

# Messages — yellow
set -g message-style \
    "bg=#ffdd33,fg=#181818,bold"

# Copy mode
setw -g mode-style \
    "bg=#453d41,fg=#e4e4ef"

# Activity — green
setw -g window-status-activity-style \
    "bg=#181818,fg=#73c936,bold"

# Bell — red
setw -g window-status-bell-style \
    "bg=#f43841,fg=#181818,bold"

# No separators
set -g window-status-separator ""
