# ============================================================
# Retrobox
# Based on Vim's retrobox dark palette
# ============================================================

# Palette
# BG       #1c1c1c
# BG1      #303030
# BG2      #3c3836
# FG       #ebdbb2
# FG1      #d5c4a1
# GREY     #928374
# RED      #fb4934
# GREEN    #b8bb26
# YELLOW   #fabd2f
# BLUE     #83a598
# PURPLE   #d3869b
# AQUA     #8ec07c
# ORANGE   #fe8019

# Status
set -g status-style "bg=#1c1c1c,fg=#928374"
set -g status-left-length 60
set -g status-right-length 100

# Session — orange
set -g status-left \
    "#[bg=#fe8019,fg=#1c1c1c,bold] #S #[default]"

# Inactive windows
setw -g window-status-format \
    "#[bg=#1c1c1c,fg=#928374] #W "

# Active window — yellow
setw -g window-status-current-format \
    "#[bg=#fabd2f,fg=#1c1c1c,bold] #W "

# Date — aqua, time — green
set -g status-right \
    "#[fg=#8ec07c] %Y-%m-%d #[fg=#b8bb26,bold]%H:%M "

# Pane borders
set -g pane-border-style "fg=#3c3836"
set -g pane-active-border-style "fg=#83a598"

# Messages — orange
set -g message-style \
    "bg=#fe8019,fg=#1c1c1c,bold"

# Copy mode — purple
setw -g mode-style \
    "bg=#3c3836,fg=#d3869b"

# Activity — green
setw -g window-status-activity-style \
    "bg=#1c1c1c,fg=#b8bb26,bold"

# Bell — red
setw -g window-status-bell-style \
    "bg=#fb4934,fg=#1c1c1c,bold"

# No separators
set -g window-status-separator ""
