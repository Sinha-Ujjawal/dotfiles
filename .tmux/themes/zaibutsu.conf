# ============================================================
# Zaibutsu
# ============================================================

# Background / foreground
set -g status-style "bg=#0e0024,fg=#878092"

# Status
set -g status-left-length 60
set -g status-right-length 100

# Session — purple
set -g status-left \
    "#[bg=#af87ff,fg=#0e0024,bold] #S #[default]"

# Inactive windows
setw -g window-status-format \
    "#[bg=#0e0024,fg=#878092] #W "

# Active window — yellow
setw -g window-status-current-format \
    "#[bg=#ffff87,fg=#0e0024,bold] #W "

# Date — green, time — pink
set -g status-right \
    "#[fg=#87d787] %Y-%m-%d #[fg=#ff87af,bold]%H:%M "

# Pane borders
set -g pane-border-style "fg=#362b49"
set -g pane-active-border-style "fg=#af87ff"

# Messages
set -g message-style \
    "bg=#ff87af,fg=#0e0024,bold"

# Copy mode
setw -g mode-style \
    "bg=#362b49,fg=#d787ff"

# Activity
setw -g window-status-activity-style \
    "bg=#0e0024,fg=#87d787,bold"

# Bell
setw -g window-status-bell-style \
    "bg=#ff87af,fg=#0e0024,bold"

# No separators
set -g window-status-separator ""
